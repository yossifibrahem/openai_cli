[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openai-cli-chat"
version = "0.1.0"
description = "A feature-rich command-line chat app for OpenAI-compatible APIs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["openai", "cli", "chat", "ai", "gpt"]
dependencies = [
    "openai>=1.30.0",
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.43",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "pyperclip>=1.8.2",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "ruff>=0.4.0", "mypy>=1.9.0"]

[project.scripts]
ai = "openai_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
